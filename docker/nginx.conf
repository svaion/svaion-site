# svaiontech.com as static files, served the way Cloudflare Pages serves out/ (README, "Docker").
# The location blocks, with their security headers, are generated from out/_headers at image build.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Relative redirects, so /privacy → /privacy/ works behind any proxy or port mapping.
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/plain text/xml application/xml application/json image/svg+xml;

    error_page 404 /404.html;

    include /etc/nginx/svaion/locations.conf;
}
