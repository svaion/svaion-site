# docker compose up --build -d   → http://localhost:8080
# Bound to this machine only. On a server, put TLS in front (Cloudflare or a reverse proxy) before opening it up.
services:
  site:
    build:
      context: .
      target: serve
    image: svaion-site
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
